<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f86ff"/>
      <stop offset="1" stop-color="#6a3dff"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe6ff"/>
    </linearGradient>
    <radialGradient id="lens" cx=".4" cy=".35" r=".75">
      <stop offset="0" stop-color="#5ee7ff"/>
      <stop offset=".45" stop-color="#2b6dff"/>
      <stop offset="1" stop-color="#0d1650"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="60" fill="url(#bg)"/>
  <path d="M8 120 A112 112 0 0 1 120 8 h8 A120 120 0 0 0 8 128z" fill="#fff" opacity=".10"/>
  <!-- tavan ayağı -->
  <rect x="150" y="40" width="64" height="18" rx="9" fill="#fff" opacity=".9"/>
  <path d="M174 56 L166 98" stroke="#fff" stroke-width="16" stroke-linecap="round" opacity=".9"/>
  <!-- gövde (aşağı-sola bakan bullet kamera) -->
  <g transform="rotate(-18 128 128)">
    <rect x="70" y="98" width="140" height="66" rx="26" fill="url(#body)"/>
    <rect x="64" y="90" width="118" height="16" rx="8" fill="#fff"/>
    <ellipse cx="72" cy="131" rx="22" ry="35" fill="#1a2470"/>
    <ellipse cx="70" cy="131" rx="15" ry="26" fill="url(#lens)"/>
    <ellipse cx="65" cy="121" rx="4.5" ry="7" fill="#fff" opacity=".85"/>
    <circle cx="186" cy="131" r="8" fill="#ff4d61"/>
  </g>
  <!-- görüş dalgaları -->
  <path d="M46 188 a40 40 0 0 0 30 22" stroke="#fff" stroke-width="10" stroke-linecap="round" fill="none" opacity=".9"/>
  <path d="M30 196 a62 62 0 0 0 44 34" stroke="#fff" stroke-width="10" stroke-linecap="round" fill="none" opacity=".55"/>
</svg>
